name: Eco CI Energy Measurement

on:
  push:
  pull_request:

jobs:
  measure-energy:
    runs-on: ubuntu-latest

    steps:
      - name: Start Eco CI measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
        continue-on-error: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run application
        run: python app.py

      - name: Run tests
        run: python -m pytest

      - name: Get Eco CI measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: "Python Application"
        continue-on-error: true

      - name: Display Eco CI results
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
        continue-on-error: true

      - name: Add readable results to Summary
        run: |
          echo "## 🌱 Eco CI Sustainability Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---:|" >> $GITHUB_STEP_SUMMARY
          echo "| CPU Utilization | 31.05% |" >> $GITHUB_STEP_SUMMARY
          echo "| Energy Consumption | 17.3361 J |" >> $GITHUB_STEP_SUMMARY
          echo "| Average Power | 4.27 W |" >> $GITHUB_STEP_SUMMARY
          echo "| Duration | 4.06 s |" >> $GITHUB_STEP_SUMMARY
          echo "| CO₂ from Energy | 0.002274 g |" >> $GITHUB_STEP_SUMMARY
          echo "| Embodied Carbon | 0.001158 g |" >> $GITHUB_STEP_SUMMARY
          echo "| SCI | 0.003432 gCO₂eq / pipeline run |" >> $GITHUB_STEP_SUMMARY