name: Eco CI Energy Measurement

on:
  push:
  pull_request:

jobs:
  measure-energy:
    runs-on: ubuntu-latest

    steps:
      - name: Start Eco CI measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
        continue-on-error: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run application
        run: python app.py

      - name: Run tests
        run: python -m pytest

      - name: Get Eco CI measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: "Python Application"
        continue-on-error: true

      - name: Display Eco CI results
        id: eco-results
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
        continue-on-error: true

      - name: Add Eco CI results to Summary
        env:
          ECO_DATA: ${{ steps.eco-results.outputs.data-total-json }}
        run: |
          echo "## 🌱 Eco CI Sustainability Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"

          echo "| CPU Utilization | $(echo "$ECO_DATA" | jq -r '.cpu_utilization // "N/A"')% |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Energy Consumption | $(echo "$ECO_DATA" | jq -r '.energy // "N/A"') J |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Average Power | $(echo "$ECO_DATA" | jq -r '.power // "N/A"') W |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Duration | $(echo "$ECO_DATA" | jq -r '.duration // "N/A"') s |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Raw Eco CI measurement:**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$ECO_DATA" | jq . >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"